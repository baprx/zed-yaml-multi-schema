name: Release LSP binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build language server
        run: cargo build --release --features lsp-bin --target ${{ matrix.target }}

      - name: Package (binary at archive root)
        run: |
          tar -czf "yaml-multi-schema-lsp-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" yaml-multi-schema-lsp
          tar -tzf "yaml-multi-schema-lsp-${{ matrix.target }}.tar.gz"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "yaml-multi-schema-lsp-${{ matrix.target }}.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"
