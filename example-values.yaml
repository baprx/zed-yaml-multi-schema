---
# $schema=./schemas/test.schema.json
test:
  enabled: true
  elements:
    - 1
    - A
  product: anch
  image:
    repository: s
    pullPolicy: "IfNotPresent"
    tag: s
  version: 1

# $schema=https://raw.githubusercontent.com/traefik/traefik-helm-chart/refs/heads/master/traefik/values.schema.json
traefik:
  enabled: true
  image:
    registry: example.com
    repository: traefik
    tag: 1.1.1

# $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
app-template:
  controllers:
    example:
      replicas: 1
      containers:
        app:
          image:
            tag: v1
            repository: example

kubernetes:
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: my-config
    namespace: default
  data:
    config.yaml: |
      key: value
